name: Kickoff reminder

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send one-hour kickoff reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Add a GitHub Actions secret named CRON_SECRET (same value as Vercel CRON_SECRET)."
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            https://ollyofc.vercel.app/api/notify-kickoff-reminder
